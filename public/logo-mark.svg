  <circle cx="20.5" cy="30.5" r="3.4" fill="url(#mpRose)"/>
  <path d="M12.5 48.5 L23 36.5 L31.5 45.5 L38.5 39 L45.5 48.5 Z" fill="url(#mpRose)" opacity=".85"/>
