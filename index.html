<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDF8F2" />

    <title>Memory Print — Vos moments, nos tirages.</title>
    <meta
      name="description"
      content="Memory Print est un studio local d'impression photo à Mahdia. Envoyez-nous vos photos : tirages haut de gamme, albums faits main et cartes de visite professionnelles."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_TN" />
    <meta property="og:locale:alternate" content="ar_TN" />
    <meta property="og:title" content="Memory Print — Vos moments, nos tirages." />
    <meta
      property="og:description"
      content="Impression photo haut de gamme, albums photo faits main et cartes de visite professionnelles à Mahdia."
    />
    <meta property="og:image" content="/images/hero-prints.jpg" />

    <!-- Apply the saved language before first paint so Arabic doesn't flash LTR -->
    <script>
      try {
        var l = localStorage.getItem('lang') || (navigator.language.indexOf('ar') === 0 ? 'ar' : 'fr')
        if (l === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..700&family=El+Messiri:wght@400..700&family=Cairo:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
